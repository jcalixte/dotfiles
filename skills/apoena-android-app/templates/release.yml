name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      APK_NAME: {{APP_ID}}-${{ gitea.ref_name }}.apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Not setup-java's `cache: gradle`: the Gitea cache server lowercases keys, setup-java
      # then never sees an exact hit and saves the whole cache again on every run.
      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # AGP installs the platforms and build-tools it needs during the build.
      - uses: actions/cache@v5
        with:
          path: ~/.android/sdk
          key: android-sdk-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: android-sdk-

      - uses: android-actions/setup-android@v4

      - name: Decode App key
        env:
          APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        run: echo "$APP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/app-key.jks"

      - name: Build signed APK
        env:
          APP_KEYSTORE_PATH: ${{ runner.temp }}/app-key.jks
          APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          APP_KEY_ALIAS: ${{ secrets.APP_KEY_ALIAS }}
          APP_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease -PreleaseVersion="${GITHUB_REF_NAME#v}"

      # An unsigned build is named app-release-unsigned.apk, so a missing App key fails here.
      - name: Verify signature
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          mv app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/$APK_NAME"

      - name: Publish Gitea release
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          API="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
          RELEASE_ID=$(curl -fsS -X POST "$API/releases" \
            -H "Authorization: token $GITEA_TOKEN" -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$GITHUB_REF_NAME\",\"name\":\"$GITHUB_REF_NAME\"}" \
            | node -pe 'JSON.parse(require("fs").readFileSync(0)).id')
          curl -fsS -X POST "$API/releases/$RELEASE_ID/assets?name=$APK_NAME" \
            -H "Authorization: token $GITEA_TOKEN" -F "attachment=@$RUNNER_TEMP/$APK_NAME"

      # Pins this Release in the Store's apps.yaml; that commit fires the Store's push webhook (Store ADR 0006).
      - name: Pin the Release in the Store
        env:
          STORE_GITEA_TOKEN: ${{ secrets.STORE_GITEA_TOKEN }}
        run: |
          curl -fsS https://git.apoena.dev/julien/store/raw/branch/main/fdroid/pin-release.mjs \
            | node - {{APP_ID}} "$GITHUB_REF_NAME"
