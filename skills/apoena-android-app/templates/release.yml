name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      APK_NAME: {{APP_ID}}-${{ gitea.ref_name }}.apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v4

      - name: Decode App key
        env:
          APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        run: echo "$APP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/app-key.jks"

      - name: Build signed APK
        env:
          APP_KEYSTORE_PATH: ${{ runner.temp }}/app-key.jks
          APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          APP_KEY_ALIAS: ${{ secrets.APP_KEY_ALIAS }}
          APP_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease -PreleaseVersion="${GITHUB_REF_NAME#v}"

      # An unsigned build is named app-release-unsigned.apk, so a missing App key fails here.
      - name: Verify signature
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          mv app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/$APK_NAME"

      - name: Publish Gitea release
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          API="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
          RELEASE_ID=$(curl -fsS -X POST "$API/releases" \
            -H "Authorization: token $GITEA_TOKEN" -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$GITHUB_REF_NAME\",\"name\":\"$GITHUB_REF_NAME\"}" \
            | node -pe 'JSON.parse(require("fs").readFileSync(0)).id')
          curl -fsS -X POST "$API/releases/$RELEASE_ID/assets?name=$APK_NAME" \
            -H "Authorization: token $GITEA_TOKEN" -F "attachment=@$RUNNER_TEMP/$APK_NAME"

      - name: Rebuild the Store
        if: ${{ vars.STORE_COOLIFY_UUID != '' }}
        env:
          STORE_DEPLOY_TOKEN: ${{ secrets.STORE_DEPLOY_TOKEN }}
          STORE_COOLIFY_UUID: ${{ vars.STORE_COOLIFY_UUID }}
        run: |
          curl -fsS -X POST "https://platform.apoena.dev/api/v1/deploy?uuid=$STORE_COOLIFY_UUID&force=true" \
            -H "Authorization: Bearer $STORE_DEPLOY_TOKEN"
