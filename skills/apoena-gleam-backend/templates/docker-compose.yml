services:
  web:
    build: .
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    environment:
      - PORT=8000
    expose:
      - "8000"
    volumes:
      - <APP_NAME>-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  <APP_NAME>-data:
