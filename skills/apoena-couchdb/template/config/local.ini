; Copied to /opt/couchdb/etc/local.d/10-local.ini by the Dockerfile.
; The entrypoint writes the admin account to local.d/docker.ini, which loads after this file.

[couchdb]
; Create _users and _replicator at first start.
; Without this, CouchDB stays in "setup needed" state and returns 500 on many endpoints.
single_node = true
; New databases: only admins can read and write until you set a _security object.
default_security = admin_only

[chttpd]
bind_address = 0.0.0.0
; JWT first: browser apps send an Authentik access token as `Authorization: Bearer`.
; Cookie and basic auth stay for Fauxton and admin scripts.
authentication_handlers = {chttpd_auth, jwt_authentication_handler}, {chttpd_auth, cookie_authentication_handler}, {chttpd_auth, default_authentication_handler}
; Only admins can list databases.
admin_only_all_dbs = true
; require_valid_user stays off on purpose. It makes CouchDB answer every anonymous
; request with "WWW-Authenticate: Basic", which breaks CORS preflight for browser apps
; and collides with the proxy's basic auth on /_utils. Data stays protected by
; default_security and admin_only_all_dbs above.
; Behind a reverse proxy (Coolify/Traefik), trust the forwarded scheme.
x_forwarded_ssl = X-Forwarded-Ssl
; CORS is handled by Traefik (see docker-compose.coolify.yml) because
; CouchDB's [cors] origins accepts only an explicit list, not a wildcard subdomain.

[chttpd_auth]
; 1 day sessions.
timeout = 86400

[jwt_auth]
; `sub` (the Authentik user uuid) is the CouchDB user name. Access comes from the
; `members.names` of each database's _security. Only tokens from the {{APP}} provider pass.
required_claims = exp, {iss, "{{ISS}}"}

[jwt_keys]
; Public keys of the Authentik signing certificates, one line per `kid`. CouchDB does
; not fetch JWKS: when Authentik changes its signing key, add the new key here.
{{JWT_KEYS}}
